<!DOCTYPE html>
<html>
<body>
    <h2> JAVASCRIPT FOR LOOP</h2>
    <P id="demo"></P>
    <script>
      var fruits = ["Banana", "Orange", "Apple", "Mango", "Kiwi", "Pineapple", "Grapes"];
        var text = "";
        for (var i = 0; i < fruits.length; i++) {
            text += fruits[i] + "<br>";
        }
        document.getElementById("demo").innerHTML = text;
        
    </script>
</body>
</html>
